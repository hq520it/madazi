# P1 事件总线：Redis（madazi-server 跨副本 pub/sub + presence 快照交换）
# - 纯内存（无 PVC）：总线消息不落盘，副本状态可重建；重启清空 = 全员重新上报快照
# - maxmemory 256mb + noeviction：pub/sub 不占内存；presence key 全部短 TTL，逐出策略无感
# - 镜像经 colima docker pull → k3s ctr import（铁律：-n k8s.io）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: madazi-redis
  namespace: madazi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: madazi-redis
  template:
    metadata:
      labels:
        app: madazi-redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        args:
        - redis-server
        - --maxmemory
        - 256mb
        - --maxmemory-policy
        - noeviction
        - --save
        - ""          # 关闭 RDB 落盘（纯内存语义）
        - --appendonly
        - "no"
        ports:
        - containerPort: 6379
        resources:
          requests:
            memory: 32Mi
            cpu: 20m
          limits:
            memory: 320Mi
        readinessProbe:
          tcpSocket:
            port: 6379
          initialDelaySeconds: 3
          periodSeconds: 5
        livenessProbe:
          tcpSocket:
            port: 6379
          initialDelaySeconds: 10
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: madazi-redis
  namespace: madazi
spec:
  selector:
    app: madazi-redis
  ports:
  - port: 6379
    targetPort: 6379
