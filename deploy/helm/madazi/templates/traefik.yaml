{{- if .Values.traefik.enabled }}
# ★ P3（2026-08-24）：Traefik 入口网关——公网链路 frp/LB → traefik NodePort → 本表分流。
#   收益：dsh 数据面（events.mux 事件流/RPC）与 server 解耦，server 滚动发版不再杀 dsh WS。
#   路由表与 server src/services/dsh-web-proxy.js 分流语义逐条镜像
#   （PLATFORM_API 家族正则 = 三表同步铁律的第三处，改一处必改另两处）。
# CRD 在 chart crds/ 目录（helm install 自动装载，不随 upgrade 更新——Traefik CRD 稳定）。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: traefik
  namespace: {{ include "madazi.ns" . }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: madazi-traefik
rules:
  - apiGroups: [""]
    # configmaps/nodes：v3.4+ CRD provider 必需（缺 configmaps → informer cache sync 卡死，路由永不加载）
    resources: [services, endpoints, secrets, nodes, configmaps]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, ingressclasses]
    verbs: [get, list, watch]
  - apiGroups: [traefik.io]
    resources: ["*"]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: madazi-traefik
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: madazi-traefik
subjects:
  - kind: ServiceAccount
    name: traefik
    namespace: {{ include "madazi.ns" . }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traefik
  namespace: {{ include "madazi.ns" . }}
  labels: { app: traefik }
spec:
  replicas: 1
  selector:
    matchLabels: { app: traefik }
  template:
    metadata:
      labels: { app: traefik }
    spec:
      serviceAccountName: traefik
      terminationGracePeriodSeconds: 30
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 6 }}
      {{- end }}
      containers:
        - name: traefik
          image: {{ .Values.traefik.image }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --entryPoints.web.address=:80
            # ★ WS/长连接：默认 readTimeout=60s / idleTimeout=180s 会杀静默事件流 WS，必须关
            - --entryPoints.web.transport.respondingTimeouts.readTimeout=0
            - --entryPoints.web.transport.respondingTimeouts.idleTimeout=0
            # 内部管理入口（ping 探针用，不对外）
            - --entryPoints.traefik.address=:8080
            - --ping.entryPoint=traefik
            - --providers.kubernetesCRD=true
            - --providers.kubernetesIngress=false
            - --api.dashboard=false
            - --log.level=INFO
            - --accesslog=true
          ports:
            - { name: web, containerPort: 80 }
            - { name: traefik, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /ping, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /ping, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 15
          resources: {{- toYaml .Values.traefik.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: traefik
  namespace: {{ include "madazi.ns" . }}
spec:
  {{- if eq .Values.service.type "NodePort" }}
  type: NodePort
  {{- end }}
  selector: { app: traefik }
  ports:
    - name: web
      port: 80
      targetPort: 80
      {{- if eq .Values.service.type "NodePort" }}
      # traefik.enabled 时入口 NodePort 归 traefik（server 退 ClusterIP）
      nodePort: {{ .Values.service.serverNodePort }}
      {{- end }}
---
# ── Middleware ───────────────────────────────────────────────
# 登录门：forwardAuth 调 server 探针（Bearer/query 经 X-Forwarded-Uri/cookie 三通道判定）
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: dsh-auth
  namespace: {{ include "madazi.ns" . }}
spec:
  forwardAuth:
    address: http://madazi-server:3456/api/auth/check
---
# /dsh-web/* → /*（官方 UI 根路径，与 server proxyReq 路径重写同语义）
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-dsh-web
  namespace: {{ include "madazi.ns" . }}
spec:
  stripPrefix:
    prefixes: ["/dsh-web"]
---
# 特权 RPC 伪装 loopback（Host→127.0.0.1 + 删 Origin），语义 = server PRIVILEGED_RPC 反代改写
# （官方 isTrustedApiRequest 围栏：settings./credentials./agentPreset./host.pickDirectory/openPath/llm./pluginInventory）
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: dsh-privileged
  namespace: {{ include "madazi.ns" . }}
spec:
  headers:
    customRequestHeaders:
      Host: "127.0.0.1"
      Origin: ""
---
# ── IngressRoute ─────────────────────────────────────────────
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: madazi-entry
  namespace: {{ include "madazi.ns" . }}
spec:
  entryPoints: [web]
  routes:
    # 1) 预览子域（最高优先级：Host 匹配，任意路径 → server 动态 podIP 代理；子域名即鉴权）
    - match: HostRegexp(`^pv-[a-z0-9]{8}\.{{ .Values.previewDomain | replace "." "\\." }}$`)
      kind: Rule
      priority: 10000
      services:
        - { name: madazi-server, port: 3456 }
    # 2) 平台 API 家族（正则与 server PLATFORM_API / pod nginx 白名单镜像）
    #    ★ session/ 会话数据层（2026-09-04：0.1.2 斜杠 /api/session/* 须经 server 权限拦截）
    - match: PathRegexp(`^/api/(health$|auth(?:/|$)|keys(?:/|$)|admin(?:/|$)|market(?:/|$)|projects(?:/|$)|dsh(?:/|$)|session(?:/|$)|llm(?:/|$)|templates(?:/|$)|skills(?:/|$)|license(?:/|$)|ws(?:/|$))`)
      kind: Rule
      priority: 1000
      services:
        - { name: madazi-server, port: 3456 }
    # 2.5) dsh skills.list Remote RPC（skills namespace 唯一方法），非平台家族——
    #      Platform 无 /api/skills/list 端点；RE2 不支持负向前瞻，故用精确路由表达「skills/list 非平台」。
    - match: PathRegexp(`^/api/skills/list$`)
      kind: Rule
      priority: 1100
      middlewares:
        - { name: dsh-auth }
      services:
        - { name: madazi-dsh-web, port: 3080 }
    # 2.6) dsh llm.* Remote RPC（模型设置 tab 消费），非平台家族——RE2 无负向前瞻 → 精确路由；
    #      需 loopback 伪装（官方 llm. 属特权 RPC）。
    - match: PathRegexp(`^/api/llm/(listProviders|discoverModels|listConfigurableProviders|adapters)$`)
      kind: Rule
      priority: 1100
      middlewares:
        - { name: dsh-auth }
        - { name: dsh-privileged }
      services:
        - { name: madazi-dsh-web, port: 3080 }
    # 3) 特权 dsh RPC（登录门 + loopback 伪装；优先级须高于 /api 兜底）
    - match: PathRegexp(`^/api/(settings\.|credentials\.|agentPreset\.|host\.pickDirectory|host\.openPath|llm\.|pluginInventory)`)
      kind: Rule
      priority: 200
      middlewares:
        - { name: dsh-auth }
        - { name: dsh-privileged }
      services:
        - { name: madazi-dsh-web, port: 3080 }
    # 3.5) dsh 事件流 WS 豁免：继续直达 pod（红线：server 滚动发版不断 dsh 事件流；
    #      RPC HTTP 面 2026-08-27 起改经 server 做会话数据层权限拦截，WS 不切）
    - match: PathRegexp(`^/api/events\.(mux|host)`)
      kind: Rule
      priority: 150
      middlewares:
        - { name: dsh-auth }
      services:
        - { name: madazi-dsh-web, port: 3080 }
    # 4) 其余 /api/*（dsh RPC HTTP 面）→ 登录门 → madazi-server（鉴权 + 会话数据层权限
    #    SESSION_RPC 拦截 + PLATFORM_API fall-through 反代 pod；新增 dsh RPC 仍零配置自动通）
    - match: PathPrefix(`/api`)
      kind: Rule
      priority: 100
      middlewares:
        - { name: dsh-auth }
      services:
        - { name: madazi-server, port: 3456 }
    # 5) /dsh-web 静态（公开：登录页/工作台壳必须可加载）→ 剥前缀 → dsh-web
    - match: PathPrefix(`/dsh-web`)
      kind: Rule
      middlewares:
        - { name: strip-dsh-web }
      services:
        - { name: madazi-dsh-web, port: 3080 }
    # 6) 官方静态绝对路径（公开）
    - match: PathPrefix(`/plugins`) || PathPrefix(`/assets`) || PathPrefix(`/favicon`)
      kind: Rule
      services:
        - { name: madazi-dsh-web, port: 3080 }
    # 7) dsh 数据面顶层挂载（登录门；公网反代层须将这些前缀指向本入口）
    - match: PathPrefix(`/socket.io`) || PathPrefix(`/git`) || PathPrefix(`/workbench-sounds`) || PathPrefix(`/ultra-slash`)
      kind: Rule
      middlewares:
        - { name: dsh-auth }
      services:
        - { name: madazi-dsh-web, port: 3080 }
{{- end }}
