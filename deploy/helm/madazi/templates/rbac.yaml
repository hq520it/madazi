# madazi-server 动态管理 preview/dsh 任务 Pod 的权限
apiVersion: v1
kind: ServiceAccount
metadata:
  name: madazi-server
  namespace: {{ include "madazi.ns" . }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: madazi-worker-manager
  namespace: {{ include "madazi.ns" . }}
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch", "create", "delete"]
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get"]
- apiGroups: [""]
  resources: ["pods/exec"]
  verbs: ["get", "create"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: madazi-server-worker-manager
  namespace: {{ include "madazi.ns" . }}
subjects:
- kind: ServiceAccount
  name: madazi-server
  namespace: {{ include "madazi.ns" . }}
roleRef:
  kind: Role
  name: madazi-worker-manager
  apiGroup: rbac.authorization.k8s.io
