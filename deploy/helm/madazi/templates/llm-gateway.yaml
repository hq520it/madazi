# S2-2: madazi-llm-gateway 独立 deployment
# 只读 api_keys/model_costs/settings，只写 usage_logs（共用 Postgres）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: madazi-llm-gateway
  namespace: {{ include "madazi.ns" . }}
spec:
  replicas: {{ .Values.llmGateway.replicas }}
  selector:
    matchLabels: { app: madazi-llm-gateway }
  template:
    metadata:
      labels: { app: madazi-llm-gateway }
    spec:
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 6 }}
      {{- end }}
      containers:
        - name: gateway
          image: {{ include "madazi.llmGatewayImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{ containerPort: 3459 }]
          env:
            # POSTGRES_PASSWORD 必须在 DATABASE_URL 之前（$(VAR) 展开依赖定义顺序）
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ include "madazi.secretName" . }}, key: POSTGRES_PASSWORD }
            - name: DATABASE_URL
              value: "postgresql://postgres:$(POSTGRES_PASSWORD)@madazi-postgres:5432/madazi"
            - name: KEY_MASTER_SECRET
              valueFrom:
                secretKeyRef: { name: {{ include "madazi.secretName" . }}, key: KEY_MASTER_SECRET }
            - name: GATEWAY_UPSTREAM_BASE_URL
              value: {{ .Values.llmGateway.upstreamBaseUrl | quote }}
            - name: GATEWAY_GRANT_USD
              value: {{ .Values.llmGateway.grantUsd | quote }}
          resources: {{- toYaml .Values.llmGateway.resources | nindent 12 }}
          readinessProbe:
            httpGet: { path: /healthz, port: 3459 }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 3459 }
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: madazi-llm-gateway
  namespace: {{ include "madazi.ns" . }}
spec:
  {{- if eq .Values.service.type "NodePort" }}
  type: NodePort
  {{- end }}
  selector: { app: madazi-llm-gateway }
  ports:
    - port: 3459
      targetPort: 3459
      {{- if eq .Values.service.type "NodePort" }}
      nodePort: {{ .Values.service.gatewayNodePort }}
      {{- end }}
